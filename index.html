```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer GPS</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        button {
            width: 100%;
            font-size: 18px;
            padding: 14px;
            border-radius: 8px;
        }

        input,
        textarea {
            border: 1px solid #bbb;
            background: white;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        button {
            border: none;
            background: #222;
            color: white;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.98);
        }

        .location-box {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 10px;
            border: 1px solid #ddd;
        }

        .location-box p {
            margin: 8px 0;
            font-size: 17px;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }

        .saved-section {
            margin-top: 35px;
        }

        .saved-section h2 {
            margin-bottom: 10px;
        }

        .location-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 15px;
            margin-top: 12px;
        }

        .location-card p {
            margin: 7px 0;
            word-break: break-word;
        }

        .coordinates {
            font-family: monospace;
            font-size: 16px;
        }

        .small-button {
            font-size: 15px;
            padding: 10px;
        }

        .danger {
            background: #b00020;
        }

        .empty {
            text-align: center;
            color: #666;
            padding: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📍 Customer GPS</h1>

    <label for="customer">Customer / Location</label>

    <input
        type="text"
        id="customer"
        placeholder="Enter customer name"
    >


    <label for="pincode">Pincode</label>

    <input
        type="number"
        id="pincode"
        placeholder="Enter pincode"
    >


    <button onclick="getLocation()">
        📍 GET CURRENT LOCATION
    </button>


    <div class="location-box">

        <p>
            <strong>Latitude:</strong>
            <span id="latitude">—</span>
        </p>

        <p>
            <strong>Longitude:</strong>
            <span id="longitude">—</span>
        </p>

        <p>
            <strong>Accuracy:</strong>
            <span id="accuracy">—</span>
        </p>

    </div>


    <label for="note">House / Landmark Note</label>

    <textarea
        id="note"
        placeholder="Example: Blue gate, beside sappota tree"
    ></textarea>


    <button onclick="saveLocation()">
        💾 SAVE LOCATION
    </button>


    <div id="status"></div>


    <!-- SAVED LOCATIONS -->

    <div class="saved-section">

        <h2>
            Saved Locations:
            <span id="locationCount">0</span>
        </h2>

        <button
            class="small-button"
            onclick="displayLocations()"
        >
            👁️ VIEW SAVED LOCATIONS
        </button>


        <button
            class="small-button"
            onclick="exportCSV()"
        >
            📥 EXPORT CSV
        </button>


        <button
            class="small-button danger"
            onclick="clearLocations()"
        >
            🗑️ CLEAR ALL DATA
        </button>


        <div id="savedLocations"></div>

    </div>

</div>


<script>

let currentLatitude = null;
let currentLongitude = null;
let currentAccuracy = null;


// =====================================
// GET GPS LOCATION
// =====================================

function getLocation() {

    const status =
        document.getElementById("status");

    if (!navigator.geolocation) {

        status.textContent =
            "❌ GPS is not supported on this device.";

        return;
    }

    status.textContent =
        "📡 Getting location...";


    navigator.geolocation.getCurrentPosition(

        function(position) {

            currentLatitude =
                position.coords.latitude;

            currentLongitude =
                position.coords.longitude;

            currentAccuracy =
                position.coords.accuracy;


            document.getElementById("latitude").textContent =
                currentLatitude.toFixed(6);

            document.getElementById("longitude").textContent =
                currentLongitude.toFixed(6);

            document.getElementById("accuracy").textContent =
                Math.round(currentAccuracy) + " m";


            status.textContent =
                "✅ Location captured";

        },


        function(error) {

            status.textContent =
                "❌ Unable to get location. Check GPS permission.";

        },


        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );
}


// =====================================
// SAVE LOCATION
// =====================================

function saveLocation() {

    const customer =
        document.getElementById("customer").value.trim();

    const pincode =
        document.getElementById("pincode").value.trim();

    const note =
        document.getElementById("note").value.trim();


    if (!customer) {

        alert("Enter customer / location name.");

        return;
    }


    if (currentLatitude === null) {

        alert("Get the GPS location first.");

        return;
    }


    const record = {

        customer: customer,

        pincode: pincode,

        latitude: currentLatitude,

        longitude: currentLongitude,

        accuracy: currentAccuracy,

        note: note,

        savedAt: new Date().toISOString()

    };


    const existing =
        JSON.parse(
            localStorage.getItem("customerLocations")
        ) || [];


    existing.push(record);


    localStorage.setItem(
        "customerLocations",
        JSON.stringify(existing)
    );


    document.getElementById("status").textContent =
        "✅ Location saved";


    updateCount();


    // Clear fields for next customer

    document.getElementById("customer").value = "";

    document.getElementById("pincode").value = "";

    document.getElementById("note").value = "";

    document.getElementById("latitude").textContent = "—";

    document.getElementById("longitude").textContent = "—";

    document.getElementById("accuracy").textContent = "—";


    currentLatitude = null;
    currentLongitude = null;
    currentAccuracy = null;

}


// =====================================
// LOAD SAVED DATA
// =====================================

function getSavedLocations() {

    return JSON.parse(
        localStorage.getItem("customerLocations")
    ) || [];

}


// =====================================
// UPDATE COUNT
// =====================================

function updateCount() {

    const locations =
        getSavedLocations();

    document.getElementById("locationCount").textContent =
        locations.length;

}


// =====================================
// DISPLAY LOCATIONS
// =====================================

function displayLocations() {

    const container =
        document.getElementById("savedLocations");

    const locations =
        getSavedLocations();


    container.innerHTML = "";


    if (locations.length === 0) {

        container.innerHTML =
            '<div class="empty">No saved locations yet.</div>';

        return;
    }


    locations.forEach(function(location, index) {

        const card =
            document.createElement("div");

        card.className =
            "location-card";


        card.innerHTML = `

            <p>
                <strong>${index + 1}. ${escapeHTML(location.customer)}</strong>
            </p>

            <p>
                Pincode:
                ${escapeHTML(location.pincode || "—")}
            </p>

            <p class="coordinates">
                📍 ${location.latitude},
                ${location.longitude}
            </p>

            <p>
                Accuracy:
                ${Math.round(location.accuracy)} m
            </p>

            <p>
                🏠 ${escapeHTML(location.note || "No note")}
            </p>

        `;


        container.appendChild(card);

    });

}


// =====================================
// ESCAPE HTML
// =====================================

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// =====================================
// EXPORT CSV
// =====================================

function exportCSV() {

    const locations =
        getSavedLocations();


    if (locations.length === 0) {

        alert("No saved locations to export.");

        return;
    }


    let csv =
        "Customer,Pincode,Latitude,Longitude,Accuracy (m),Landmark Note,Saved At\n";


    locations.forEach(function(location) {

        const row = [

            location.customer,

            location.pincode,

            location.latitude,

            location.longitude,

            location.accuracy,

            location.note,

            location.savedAt

        ];


        csv += row.map(function(value) {

            return `"${String(value ?? "")
                .replace(/"/g, '""')}"`;

        }).join(",") + "\n";

    });


    const blob =
        new Blob([csv], {
            type: "text/csv;charset=utf-8;"
        });


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");

    link.href = url;

    link.download =
        "customer_locations.csv";


    link.click();


    URL.revokeObjectURL(url);

}


// =====================================
// CLEAR ALL DATA
// =====================================

function clearLocations() {

    const locations =
        getSavedLocations();


    if (locations.length === 0) {

        alert("There is no saved data.");

        return;
    }


    const confirmation =
        confirm(
            "Are you sure you want to delete ALL saved locations?"
        );


    if (!confirmation) {

        return;
    }


    localStorage.removeItem(
        "customerLocations"
    );


    document.getElementById("savedLocations").innerHTML = "";

    updateCount();


    document.getElementById("status").textContent =
        "🗑️ All locations deleted";

}


// =====================================
// INITIAL LOAD
// =====================================

updateCount();

</script>

</body>
</html>
